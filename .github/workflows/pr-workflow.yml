name: Validar Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build e Testes com Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Copiar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Build
        run: npm run build

      - name: Executar Testes com Cobertura (Mínimo 80%)
        run: npm run test:cov

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar Build da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: medclinic-api:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
